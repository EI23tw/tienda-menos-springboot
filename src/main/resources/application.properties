# Base de datos MySQL (se crea ejecutando menos_db.sql en MySQL Workbench)
# Cambia usuario y contraseña por los de TU servidor MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/menos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "none": las tablas las crea el script SQL, Hibernate no las toca.
# (Puedes probar "validate" para que compruebe que las entidades coinciden con las tablas.)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
