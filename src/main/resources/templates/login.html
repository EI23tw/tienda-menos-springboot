<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Ingresar')}"></head>
<body class="d-flex flex-column min-vh-100">
  <nav th:replace="~{layout :: nav}"></nav>
  <main class="container mt-5" style="max-width:460px">
    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos.</div>
    <div class="alert alert-success" th:if="${param.registrado}">Cuenta creada. Ya puedes ingresar.</div>
    <ul class="nav nav-tabs" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pub">Cliente</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#adm">Personal administrativo</button></li></ul>
    <div class="tab-content border border-top-0 p-4">
      <div class="tab-pane fade show active" id="pub"><form th:action="@{/login}" method="post">
        <label class="form-label">Correo</label><input class="form-control mb-3" name="username" type="email" required>
        <label class="form-label">Contraseña</label><input class="form-control mb-3" name="password" type="password" required>
        <button class="btn btn-menos w-100">Ingresar</button></form>
        <p class="mt-3 mb-0 small">¿Sin cuenta? <a th:href="@{/registro}">Regístrate</a><br>Demo: cliente@menos.pe / cliente123</p></div>
      <div class="tab-pane fade" id="adm"><form th:action="@{/login}" method="post">
        <label class="form-label">Correo corporativo</label><input class="form-control mb-3" name="username" type="email" required>
        <label class="form-label">Contraseña</label><input class="form-control mb-3" name="password" type="password" required>
        <button class="btn btn-rojo w-100">Entrar al panel</button></form>
        <p class="mt-3 mb-0 small">Demo: admin@menos.pe / admin123</p></div></div>
  </main>
  <footer th:replace="~{layout :: footer}"></footer>
  <th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
