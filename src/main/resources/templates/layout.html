<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | MENOS'">MENOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <link th:href="@{/css/menos.css}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:fragment="nav" class="navbar navbar-expand-md menos-nav sticky-top">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}"><img th:src="@{/img/logo.png}" alt="MENOS" height="34"></a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mn"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="mn">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}">Productos</a></li>
        <li class="nav-item" sec:authorize="hasRole('CLIENTE')"><a class="nav-link" th:href="@{/mis-compras}">Mis compras</a></li>
        
        <!-- Opciones exclusivas de ADMIN -->
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin}">Pedidos</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/productos}">Inventario</a></li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/admin/cupones}">Cupones</a></li>
        
        <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Gráficos</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" th:href="@{/admin/graficos/ventas}">Ventas</a></li>
            <li><a class="dropdown-item" th:href="@{/admin/graficos/inventario}">Inventario y pedidos</a></li>
          </ul>
        </li>
      </ul>
      
      <a class="btn btn-menos me-2" th:href="@{/cesta}">Mi cesta <span class="badge badge-cesta" th:text="${cartCount}">0</span></a>
      <a class="btn btn-outline-primary" th:href="@{/login}" sec:authorize="!isAuthenticated()">Ingresar</a>
      <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
        <span class="small text-secondary" sec:authentication="name"></span>
        <button class="btn btn-outline-danger btn-sm">Salir</button>
      </form>
    </div>
  </div>
</nav>
<footer th:fragment="footer" class="py-4 mt-auto">
  <div class="container small">MENOS · Precios bajos, cesta llena. Proyecto académico: el pago es una simulación.</div>
</footer>
<th:block th:fragment="scripts"><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></th:block>
</body>
</html>
