<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Mi cesta')}"></head>
<body class="d-flex flex-column min-vh-100">
  <nav th:replace="~{layout :: nav}"></nav>
  <main class="container mt-4">
    <h1 class="fw-bold" style="color:var(--azul-osc)">Mi cesta</h1>
    
    <div th:if="${lineas.isEmpty()}" class="alert alert-info">
      Tu cesta está vacía. <a th:href="@{/}">Elige productos</a>.
    </div>
    
    <div th:unless="${lineas.isEmpty()}">
      <div class="table-responsive">
        <table class="table tabla align-middle">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Precio</th>
              <th>Cantidad</th>
              <th class="text-end">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="l : ${lineas}">
              <td>
                <img th:if="${l.producto.imagen != null and !l.producto.imagen.isBlank()}" 
                     th:src="@{${l.producto.imagen}}" 
                     th:alt="${l.producto.nombre}" class="thumb">
                <span th:unless="${l.producto.imagen != null and !l.producto.imagen.isBlank()}" 
                      th:text="${l.producto.emoji}"></span> 
                <span th:text="${l.producto.nombre}"></span>
              </td>
              <td th:text="'S/ ' + ${#numbers.formatDecimal(l.producto.precio,1,2)}"></td>
              <td>
                <div class="d-flex align-items-center gap-2">
                  <form th:action="@{/cesta/cambiar/{id}(id=${l.producto.id})}" method="post">
                    <input type="hidden" name="delta" value="-1">
                    <button class="btn btn-sm btn-outline-secondary" aria-label="Quitar uno">−</button>
                  </form>
                  <strong th:text="${l.cantidad}"></strong>
                  <form th:action="@{/cesta/cambiar/{id}(id=${l.producto.id})}" method="post">
                    <input type="hidden" name="delta" value="1">
                    <button class="btn btn-sm btn-outline-secondary" aria-label="Agregar uno">+</button>
                  </form>
                </div>
              </td>
              <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(l.subtotal,1,2)}"></td>
            </tr>
          </tbody>
        </table>
      </div>
      
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div class="h4 mb-0">Total: <span class="precio" th:text="'S/ ' + ${#numbers.formatDecimal(total,1,2)}"></span></div>
        <a class="btn btn-menos btn-lg" th:href="@{/pago}">Ir a pagar</a>
      </div>
    </div>
  </main>
  <footer th:replace="~{layout :: footer}"></footer>
  <th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
