<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Editar producto')}"></head>
<body><nav th:replace="~{layout :: nav}"></nav>
<main class="container mt-4" style="max-width:560px"><h1 class="h3 fw-bold" style="color:var(--azul-osc)">Editar producto</h1>
  <form th:action="@{/admin/productos/{id}/editar(id=${p.id})}" method="post">
    <label class="form-label">Nombre</label><input class="form-control mb-3" name="nombre" th:value="${p.nombre}" required>
    <label class="form-label">Descripción</label><input class="form-control mb-3" name="descripcion" th:value="${p.descripcion}" required>
    <div class="row"><div class="col"><label class="form-label">Categoría</label><input class="form-control mb-3" name="categoria" th:value="${p.categoria?.nombre}" required></div>
    <div class="col-3"><label class="form-label">Emoji</label><input class="form-control mb-3" name="emoji" th:value="${p.emoji}" required></div></div>
    <div class="row"><div class="col"><label class="form-label">Precio (S/)</label><input class="form-control mb-3" name="precio" type="number" step="0.01" th:value="${p.precio}" required></div>
    <div class="col"><label class="form-label">Stock</label><input class="form-control mb-3" name="stock" type="number" th:value="${p.stock}" required></div></div>
    <label class="form-label">Imagen (ruta, ej. /img/productos/arroz.jpg)</label><input class="form-control mb-3" name="imagen" th:value="${p.imagen}">
    <button class="btn btn-menos">Guardar cambios</button> <a class="btn btn-outline-secondary" th:href="@{/admin/productos}">Cancelar</a></form></main>
<footer th:replace="~{layout :: footer}"></footer><th:block th:replace="~{layout :: scripts}"></th:block></body></html>
