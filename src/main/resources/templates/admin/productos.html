<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Panel · Inventario')}"></head>
<body><nav th:replace="~{layout :: nav}"></nav>
<main class="container mt-4"><h1 class="fw-bold" style="color:var(--azul-osc)">Inventario</h1>
  <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>
  <form th:action="@{/admin/productos}" method="post" class="row g-2 mb-4 mp-card p-3">
    <div class="col-md-3"><input class="form-control" name="nombre" placeholder="Nombre" required></div>
    <div class="col-md-3"><input class="form-control" name="descripcion" placeholder="Descripción" required></div>
    <div class="col-md-2"><input class="form-control" name="categoria" placeholder="Categoría" required></div>
    <div class="col-md-1"><input class="form-control" name="emoji" placeholder="🍎" required></div>
    <div class="col-md-1"><input class="form-control" name="precio" type="number" step="0.01" placeholder="S/" required></div>
    <div class="col-md-1"><input class="form-control" name="stock" type="number" placeholder="Stock" required></div>
    <div class="col-md-1"><button class="btn btn-rojo w-100">Añadir</button></div></form>
  <form th:action="@{/admin/productos}" method="get" class="d-flex gap-2 mb-3"><input class="form-control" name="q" th:value="${q}" placeholder="Buscar producto por nombre"><button class="btn btn-menos">Buscar</button></form>
  <div class="table-responsive"><table class="table tabla align-middle">
    <thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th></th></tr></thead>
    <tbody><tr th:each="p : ${productos}"><td><img th:if="${p.imagen != null and !p.imagen.isBlank()}" th:src="@{${p.imagen}}" th:alt="${p.nombre}" class="thumb"><span th:unless="${p.imagen != null and !p.imagen.isBlank()}" th:text="${p.emoji}"></span> <span th:text="${p.nombre}"></span></td><td th:text="${p.categoria?.nombre}"></td><td th:text="'S/ ' + ${#numbers.formatDecimal(p.precio,1,2)}"></td><td th:text="${p.stock}"></td>
      <td class="d-flex gap-1"><a class="btn btn-sm btn-menos" th:href="@{/admin/productos/{id}/editar(id=${p.id})}">Editar</a>
        <form th:action="@{/admin/productos/{id}/eliminar(id=${p.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Eliminar</button></form></td></tr></tbody></table></div></main>
<footer th:replace="~{layout :: footer}"></footer><th:block th:replace="~{layout :: scripts}"></th:block></body></html>
